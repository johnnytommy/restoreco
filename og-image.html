<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restore Co. OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FBF6EF;
      font-family: 'Inter', sans-serif;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(circle at 18% 20%, rgba(193,85,44,0.14), transparent 42%),
        radial-gradient(circle at 85% 82%, rgba(193,85,44,0.10), transparent 45%),
        #FBF6EF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .sun-wrap {
      position: relative;
      width: 176px;
      height: 176px;
      margin-bottom: 40px;
    }
    .sun-shadow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 24px 60px -12px rgba(193,85,44,0.35), 0 8px 24px -8px rgba(36,31,28,0.15);
    }
    .wordmark {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 88px;
      color: #241F1C;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .tagline {
      margin-top: 22px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 30px;
      color: rgba(36,31,28,0.62);
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="content">
      <div class="sun-wrap">
        <div class="sun-shadow"></div>
        <svg viewBox="0 0 32 32" width="176" height="176">
          <circle cx="16" cy="16" r="6" fill="#C1552C" />
          <g stroke="#C1552C" stroke-width="1.6" stroke-linecap="round">
            <line x1="16" y1="3" x2="16" y2="7" />
            <line x1="16" y1="25" x2="16" y2="29" />
            <line x1="3" y1="16" x2="7" y2="16" />
            <line x1="25" y1="16" x2="29" y2="16" />
            <line x1="6.81" y1="6.81" x2="9.64" y2="9.64" />
            <line x1="22.36" y1="22.36" x2="25.19" y2="25.19" />
            <line x1="6.81" y1="25.19" x2="9.64" y2="22.36" />
            <line x1="22.36" y1="9.64" x2="25.19" y2="6.81" />
          </g>
        </svg>
      </div>
      <div class="wordmark">Restore Co.</div>
      <div class="tagline">Clean up and curate your dating profile</div>
    </div>
  </div>
</body>
</html>
